# ================================================================================
# Generalized 3-Axis 1-Break Sensor Probe Config (Nudge Probe Integration)
# Feature added for KTC by Asher Edwards
# (Supports Nudge probes, custom 3D touch sensors, and TypQxQ/KTC ToolChanger)
# ================================================================================

[three_axis_probe nudge]
pin: ^!PG12                # 3-axis 1-break switch input pin (NC switch, adjust MCU pin)
x: 150.0                   # Fixed X coordinate of probe center on Z axis (mm)
y: 10.0                    # Fixed Y coordinate of probe center on Z axis (mm)
z_hop: 10.0                # Safe Z height during approach (mm)
z_probe_depth: -2.0        # Depth below probe apex for X/Y probing (mm)
search_dist: 6.0           # Probing search distance for X/Y contact (mm)
z_expected: 0.0            # Nominal Z trigger height for clean nozzle (mm)
tolerance: 0.35            # Maximum Z error (mm) before flagging stuck filament/blob
speed: 2.0                 # Probing travel speed (mm/s)
debug: False               # Enable verbose debug logging to Klipper log

# Optional customizable macro callbacks (runs after probe events with parameters & state access):
# on_align_gcode: MY_ALIGN_CALLBACK
# on_blob_detected_gcode: MY_BLOB_CALLBACK

# ================================================================================
# Available G-Code Commands:
#
# 1. KTC_QUERY_THREE_AXIS_PROBE:
#    Check if the 3-axis break sensor is currently triggered manually.
#
# 2. KTC_PROBE_3AXIS_AXIS AXIS=<X|Y|Z> [TARGET=<val>] [DIRECTION=<-1|1>] [SPEED=<val>]:
#    Probe a single specified axis (X, Y, or Z) for manual testing and debugging.
#
# 3. KTC_PROBE_3AXIS_ALIGN (or KTC_THREE_AXIS_ALIGN) [VERBOSE=1]:
#    Execute full 2-pass 3D iterative tool alignment and save offsets to KTC.
#    If on_align_gcode is defined, automatically runs that macro with TOOL, X, Y, Z, APEX.
#
# 4. KTC_PROBE_3AXIS_CHECK_FILAMENT LAYER=<num> [INTERVAL=<num>]:
#    Check hotend for stuck filament / blobs after every N layers during printing.
#    If on_blob_detected_gcode is defined, automatically runs that macro.
# ================================================================================


