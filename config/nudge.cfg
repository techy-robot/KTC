# ================================================================================
# Generalized 3-Axis / Nudge Probe Configuration for KTC
# Feature added for KTC by Asher Edwards
# (Supports Nudge probes, Sexbolt, and 3D kinematic contact sensors)
# ================================================================================

[ktc_tools_calibrate]
pin: ^!PG12                # MCU input pin connected to probe switch (NC switch, adjust MCU pin)
travel_speed: 150.0        # Speed (mm/s) for positioning moves between probe touchpoints
spread: 5.0                # X/Y search radial distance (mm) from probe center when probing lateral edges
lower_z: 0.5               # Distance (mm) to lower nozzle below top Z contact point during lateral probing
lift_z: 1.0                # Distance (mm) to lift nozzle before lateral search moves
final_lift_z: 4.0          # Clearance (mm) to lift nozzle above sensor after probing finishes
#sensor_x: 150.0           # (Optional) Default nominal X coordinate of reference sensor
#sensor_y: 200.0           # (Optional) Default nominal Y coordinate of reference sensor
#sensor_z: 10.0            # (Optional) Default nominal Z coordinate of reference sensor
speed: 3.0                 # Movement speed (mm/s) during active probing contact moves
lift_speed: 10.0           # Retract speed (mm/s) when backing off after trigger contact
samples: 3                 # Number of contact probing samples per side
samples_tolerance: 0.05    # Maximum allowable deviation (mm) between probing samples
samples_tolerance_retries: 2 # Retries if sample tolerance is exceeded
samples_result: average    # Sample aggregation method: average | median

# ================================================================================
# Available G-Code Commands:
#
# 1. KTC_TOOL_LOCATE_SENSOR [AXIS=ALL|X|Y|Z] [X=1] [Y=1] [Z=1]:
#    Locate reference pin coordinate using reference tool (e.g. Tool 0).
#
# 2. KTC_TOOL_CALIBRATE_OFFSET [AXIS=ALL|X|Y|Z] [X=1] [Y=1] [Z=1] [TOOL=<name>|global] [T=<nr>] [SAVE=0|1]:
#    Calibrate tool offset relative to reference sensor location.
#    Set SAVE=1 to automatically persist calibrated offsets to KTC persistent storage.
#
# 3. KTC_TOOL_CALIBRATE_SAVE [TOOL=<name>|global] [T=<nr>]:
#    Save the last calibrated tool offset to active/specified tool or global offset.
#
# 4. KTC_TOOL_CALIBRATE_QUERY:
#    Query the current trigger state (open / TRIGGERED) of the calibration probe.
# ================================================================================
